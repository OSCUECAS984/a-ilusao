<title>A Ilusão</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">
<style>
/* Layout: palco 16:9 centrado numa tela escura; a interface em pixel flutua sobre o canvas.
   Tema único e escuro por escolha (o jogo começa no fundo de uma caverna). */
:root{
  --void:#0b0710;
  --panel:rgba(12,8,15,.9);
  --rock-line:#5a4148;
  --ember:#f2a33a;
  --ember-deep:#a8461a;
  --bone:#efe4cf;
  --bone-dim:#a99c8c;
  --danger:#e0533a;
  --teal:#7fd4c8;
  --f-display:"Pixelify Sans","Courier New",monospace;
  --f-text:"VT323","Courier New",monospace;
  --touch-h:0px;
  color-scheme:dark;
}
@media (pointer:coarse){ :root{ --touch-h:104px; } }
[hidden]{display:none!important;}
html,body{height:100%;}
body{background:var(--void);color:var(--bone);font-family:var(--f-text);overflow:hidden;-webkit-tap-highlight-color:transparent;}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
#stage{position:relative;width:min(100%, calc((100dvh - 20px - var(--touch-h)) * 16 / 9));aspect-ratio:16/9;max-width:100%;
  container-type:inline-size;background:#000;outline:none;user-select:none;-webkit-user-select:none;overflow:hidden;
  box-shadow:0 0 0 2px #1b131f,0 0 0 4px #000,0 24px 70px rgba(0,0,0,.65);}
#game{display:block;width:100%;height:100%;image-rendering:crisp-edges;image-rendering:pixelated;cursor:pointer;}

/* ---------- peças de interface ---------- */
.panel{background:var(--panel);border:2px solid var(--rock-line);box-shadow:inset 0 0 0 2px #120c14,0 0 0 2px #000;}
/* teclas: fonte de terminal (VT323), em que o "E" não se confunde com um "3" */
kbd{display:inline-block;font-family:var(--f-text);font-weight:400;font-size:1.02em;line-height:1;padding:.02em .42em .06em;margin:0 .1em;
  background:var(--bone);color:#1c1218;border-bottom:3px solid #8f7f6e;border-radius:2px;vertical-align:.08em;white-space:nowrap;}

#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:1.2cqw 1.6cqw;pointer-events:none;font-size:clamp(12px,1.9cqw,21px);}
.hud-left{display:grid;gap:.2em;justify-items:start;min-width:0;}
#hud-scene{color:var(--bone-dim);font-size:.85em;letter-spacing:.05em;text-shadow:1px 1px 0 #000;}
#hud-goal{display:inline-flex;gap:.5em;align-items:baseline;max-width:62cqw;padding:.1em .6em .2em;background:rgba(12,8,15,.78);border-left:3px solid var(--ember);line-height:1.05;}
#hud-goal b{font-family:var(--f-display);font-weight:600;font-size:.68em;letter-spacing:.16em;text-transform:uppercase;color:var(--ember);flex:none;}
#hud-goal.flash{animation:goal 1.2s steps(8);}
@keyframes goal{0%,35%{background:rgba(242,163,58,.5)}100%{background:rgba(12,8,15,.78)}}
.hud-right{display:flex;gap:.8em;align-items:center;margin-left:auto;}
#hud-cycle{color:var(--ember);text-shadow:1px 1px 0 #000;}
#hud-deaths{color:var(--bone-dim);text-shadow:1px 1px 0 #000;}
#mute{pointer-events:auto;font:inherit;color:var(--bone);background:rgba(12,8,15,.75);border:2px solid var(--rock-line);padding:0 .5em;cursor:pointer;}
#mute:focus-visible,#start:focus-visible,#touch button:focus-visible,.choice:focus-visible{outline:2px solid var(--ember);outline-offset:2px;}

/* caixa de diálogo com retrato */
#dialog{position:absolute;left:3%;right:3%;top:15%;display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.6cqw;align-items:start;
  padding:1.2cqw 1.6cqw 1.5cqw 1.2cqw;font-size:clamp(14px,2.6cqw,28px);line-height:1.1;
  opacity:0;transform:translateY(-8px);visibility:hidden;transition:opacity .2s steps(4),transform .2s steps(4),visibility 0s linear .2s;}
#dialog.open{opacity:1;transform:none;visibility:visible;transition:opacity .2s steps(4),transform .2s steps(4),visibility 0s;}
.d-face{width:clamp(48px,10cqw,110px);aspect-ratio:1;background:#120c14;border:2px solid var(--rock-line);box-shadow:inset 0 0 0 2px #000,0 0 0 2px #000;}
.d-face.talk{animation:talk .3s steps(2) infinite;}
@keyframes talk{50%{transform:translateY(-2px)}}
#portrait{display:block;width:100%;height:100%;image-rendering:crisp-edges;image-rendering:pixelated;}
.d-body{min-width:0;padding-top:.1em;}
#dialog-who{display:block;font-family:var(--f-display);font-size:.6em;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ember);margin-bottom:.25em;}
#dialog-text{margin:0;max-width:62ch;min-height:2.2em;}
#dialog-next{position:absolute;right:1.4cqw;bottom:.8cqw;color:var(--ember);font-size:.75em;animation:bob .8s steps(2) infinite;}
@keyframes bob{50%{transform:translateY(3px)}}
#dialog-choices{display:flex;gap:.8em;flex-wrap:wrap;margin-top:.5em;}
.choice{font:inherit;font-size:.9em;color:var(--bone);background:#1d1520;border:2px solid var(--rock-line);padding:.05em .7em .15em .35em;cursor:pointer;display:inline-flex;gap:.45em;align-items:center;}
.choice.sel{background:var(--ember);color:#1c1218;border-color:#ffd38a;}

#prompt{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:clamp(13px,2.15cqw,22px);padding:.2em .6em .3em;pointer-events:none;}
#prompt::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--rock-line);}

#card{position:absolute;left:6%;right:6%;top:38%;text-align:center;pointer-events:none;}
#card.show{animation:card 3.4s steps(18) forwards;}
@keyframes card{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0}}
#card-eyebrow{display:block;font-family:var(--f-display);font-size:clamp(11px,1.8cqw,18px);letter-spacing:.3em;text-transform:uppercase;color:var(--ember);text-shadow:2px 2px 0 #000;}
#card-title{margin:.1em 0 0;font-family:var(--f-display);font-weight:700;font-size:clamp(20px,5cqw,52px);line-height:1;color:var(--bone);text-shadow:3px 3px 0 #000,6px 6px 0 rgba(0,0,0,.45);text-wrap:balance;}

#toast{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);max-width:86%;text-align:center;font-size:clamp(13px,2.2cqw,23px);padding:.25em .8em .35em;pointer-events:none;}
#toast.show{animation:toast var(--dur,3.5s) linear forwards;}
@keyframes toast{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}

/* fechadura da sala secreta: três discos de pedra e um teclado numérico */
#keypad{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(46%,340px);padding:1.4cqw 1.8cqw 1.6cqw;
  display:grid;gap:.55em;justify-items:center;font-size:clamp(13px,2.3cqw,24px);text-align:center;}
#keypad h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:.8em;letter-spacing:.16em;text-transform:uppercase;color:var(--ember);}
.kp-display{display:flex;gap:.4em;}
.kp-display span{width:1.7em;height:2em;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.25em;color:var(--bone);
  background:#2a1d26;border:2px solid #000;box-shadow:inset 0 0 0 2px #4b363f,inset 0 -4px 0 2px #1a1018;}
.kp-display span.cur{box-shadow:inset 0 0 0 2px var(--ember),inset 0 -4px 0 2px #1a1018;}
#keypad.wrong .kp-display{animation:kpno .4s steps(4);}
#keypad.wrong .kp-display span{color:var(--danger);}
#keypad.right .kp-display span{color:#ffd38a;box-shadow:inset 0 0 0 2px #ffd38a,inset 0 -4px 0 2px #1a1018;}
@keyframes kpno{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.kp-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:.3em;width:100%;}
.kp-keys button{font:inherit;font-family:var(--f-display);font-weight:600;font-size:.95em;padding:.15em 0 .25em;color:var(--bone);background:#1d1520;
  border:2px solid var(--rock-line);box-shadow:0 3px 0 #000;cursor:pointer;touch-action:manipulation;}
.kp-keys button:hover{background:#2a1f2c;}
.kp-keys button:active{transform:translateY(2px);box-shadow:0 1px 0 #000;}
.kp-keys button:focus-visible{outline:2px solid var(--ember);outline-offset:2px;}
.kp-keys .ok{background:var(--ember);color:#1c1218;border-color:#ffd38a;}
.kp-hint{margin:0;color:var(--bone-dim);font-size:.75em;}

#qte{position:absolute;left:50%;top:15%;transform:translateX(-50%);width:min(64%,560px);padding:1.2cqw 1.8cqw 1.4cqw;font-size:clamp(13px,2.3cqw,24px);}
.qte-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4em;}
#qte-label{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;}
.pips{display:flex;gap:6px;}
.pips i{display:block;width:1.6cqw;height:1.6cqw;min-width:9px;min-height:9px;background:#2a1f2a;border:2px solid var(--rock-line);}
.pips i.on{background:var(--ember);border-color:#ffd38a;}
.qte-bar{position:relative;height:clamp(14px,2.6cqw,26px);background:#1b131c;border:2px solid #000;box-shadow:inset 0 0 0 2px #3a2c36;overflow:hidden;}
#qte-zone{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(90deg,#f2a33a 0 4px,#d9862a 4px 8px);box-shadow:inset 0 0 0 2px #ffd38a;}
#qte-cursor{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:var(--bone);box-shadow:0 0 0 2px #000;}
.qte-bar.hit{box-shadow:inset 0 0 0 2px #ffd38a;}
.qte-bar.miss{box-shadow:inset 0 0 0 2px var(--danger);}
#qte-hint{margin-top:.4em;color:var(--bone-dim);}
#qte-hint.hit{color:var(--ember);} #qte-hint.miss{color:var(--danger);}

#meter{position:absolute;left:50%;bottom:2.5%;transform:translateX(-50%);padding:.6cqw 1.4cqw .8cqw;font-size:clamp(12px,2cqw,20px);display:grid;gap:.25em;min-width:34%;}
.m-row{display:grid;grid-template-columns:6.2em 1fr;align-items:center;gap:.6em;}
.m-bar{height:clamp(8px,1.4cqw,14px);background:#1b131c;border:2px solid #000;box-shadow:inset 0 0 0 1px #3a2c36;}
.m-bar i{display:block;height:100%;width:0;background:var(--ember);}
#m-bal{background:#9cc46a;} #m-bal.low{background:var(--danger);}
#m-grip{background:var(--teal);} #m-grip.low{background:var(--danger);}

#ending{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.4cqw;padding:0 10%;text-align:center;pointer-events:none;}
#ending-lines{display:grid;gap:1.2cqw;width:100%;max-width:34em;}
#ending-lines p{margin:0;font-size:clamp(14px,2.7cqw,28px);line-height:1.15;color:var(--bone);text-wrap:balance;animation:rise 1.6s steps(12) both;}
#ending-lines p.voice{font-style:italic;color:var(--ember);}
#ending-lines p.small{font-size:clamp(11px,1.8cqw,18px);color:var(--bone-dim);letter-spacing:.08em;}
#ending-cycle{margin:0;font-family:var(--f-display);font-size:clamp(14px,2.6cqw,26px);letter-spacing:.3em;color:var(--ember);text-transform:uppercase;animation:rise 1.6s steps(12) both;}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- menu inicial: limpo, dentro do palco, sobre a boca da caverna ao entardecer ---------- */
#title{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 7cqw 3cqw;
  background:linear-gradient(90deg,rgba(7,4,10,.86) 0%,rgba(7,4,10,.6) 36%,rgba(7,4,10,0) 64%);}
.t-eyebrow{margin:0 0 .7em;font-family:var(--f-display);font-size:clamp(8px,1.45cqw,16px);letter-spacing:.3em;text-transform:uppercase;color:var(--ember);}
#t-name{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(36px,13cqw,150px);line-height:.88;color:var(--bone);letter-spacing:.02em;
  text-shadow:.05em .05em 0 #2a1610,.1em .1em 0 rgba(42,22,16,.55);}
.t-sub{margin:.55em 0 1.5em;font-family:var(--f-display);font-size:clamp(11px,2.5cqw,30px);color:var(--bone-dim);}
#start{font-family:var(--f-display);font-weight:700;font-size:clamp(14px,2.7cqw,30px);letter-spacing:.08em;color:#1c1218;background:var(--ember);
  border:0;padding:.5em 1.6em .55em;cursor:pointer;box-shadow:0 .2em 0 var(--ember-deep),0 0 0 3px #000,0 .2em 0 3px #000;animation:pulse 1.6s steps(4) infinite;}
@keyframes pulse{50%{background:#ffbf5c}}
#start:hover{background:#ffbf5c;}
#start:active{transform:translateY(.15em);box-shadow:0 .05em 0 var(--ember-deep),0 0 0 3px #000,0 .05em 0 3px #000;}
.t-cycle{margin:1.2em 0 0;font-size:clamp(10px,1.9cqw,20px);color:var(--bone-dim);}
.t-keys{position:absolute;left:7cqw;bottom:3.4cqw;margin:0;font-size:clamp(10px,1.8cqw,19px);color:var(--bone-dim);opacity:.85;}

/* ---------- controles de toque ---------- */
#touch{display:none;width:min(100%,680px);justify-content:space-between;gap:16px;}
@media (pointer:coarse){#touch{display:flex}}
#touch .pad{display:flex;gap:12px;}
#touch button{width:76px;height:76px;font-family:var(--f-text);font-weight:400;font-size:38px;line-height:1;color:var(--bone);background:#1d1520;border:2px solid var(--rock-line);
  box-shadow:inset 0 0 0 2px #120c14,0 4px 0 #000;touch-action:none;user-select:none;-webkit-user-select:none;}
#touch button.on{background:var(--ember);color:#1c1218;}
@media (max-width:440px){#touch{gap:10px}#touch .pad{gap:8px}#touch button{width:56px;height:56px;font-size:28px}}

@container (max-width:620px){
  #hud-scene{display:none}
  #hud{padding:6px 8px;font-size:12px}
  #hud-goal{max-width:66cqw}
  #hud-cycle{display:none}
  #mute{white-space:nowrap}
  #dialog{top:19%;left:2%;right:2%;font-size:14px;padding:6px 8px 10px 6px;gap:8px}
  #qte{top:19%;width:84%}
  #keypad{width:72%;font-size:14px;padding:8px 10px}
  #toast{bottom:3%}
}
@media (prefers-reduced-motion:reduce){#t-name,#dialog-next,#start,.d-face.talk{animation:none}}
</style>

<div id="app">
  <div id="stage" tabindex="-1">
    <canvas id="game" width="384" height="216" aria-label="A Ilusão: jogo baseado na Alegoria da Caverna de Platão"></canvas>
    <div id="hud" hidden>
      <div class="hud-left"><span id="hud-scene"></span><span id="hud-goal"><b>Objetivo</b><span id="hud-goal-text"></span></span></div>
      <div class="hud-right"><span id="hud-deaths" hidden></span><span id="hud-cycle"></span><button id="mute" type="button" aria-pressed="false">Som ligado</button></div>
    </div>
    <div id="card" hidden><span id="card-eyebrow"></span><h2 id="card-title"></h2></div>
    <div id="toast" class="panel" hidden></div>
    <div id="meter" class="panel" hidden>
      <div class="m-row"><span>Firmeza</span><div class="m-bar"><i id="m-firm"></i></div></div>
      <div class="m-row"><span>Equilíbrio</span><div class="m-bar"><i id="m-bal"></i></div></div>
      <div class="m-row"><span>Apoio</span><div class="m-bar"><i id="m-grip"></i></div></div>
    </div>
    <div id="prompt" class="panel" hidden></div>
    <div id="qte" class="panel" hidden>
      <div class="qte-head"><span id="qte-label">Golpe 1 de 3</span><span class="pips"><i></i><i></i><i></i></span></div>
      <div class="qte-bar" id="qte-bar"><div id="qte-zone"></div><div id="qte-cursor"></div></div>
      <div id="qte-hint">Aperte <kbd>E</kbd> quando o marcador passar pela faixa dourada</div>
    </div>
    <div id="keypad" class="panel" role="dialog" aria-labelledby="kp-title" hidden>
      <h2 id="kp-title">Laje de três discos</h2>
      <div class="kp-display" aria-live="polite"><span></span><span></span><span></span></div>
      <div class="kp-keys">
        <button type="button" data-d="1">1</button><button type="button" data-d="2">2</button><button type="button" data-d="3">3</button>
        <button type="button" data-d="4">4</button><button type="button" data-d="5">5</button><button type="button" data-d="6">6</button>
        <button type="button" data-d="7">7</button><button type="button" data-d="8">8</button><button type="button" data-d="9">9</button>
        <button type="button" data-d="del" aria-label="Apagar">⌫</button><button type="button" data-d="0">0</button><button type="button" data-d="ok" class="ok">OK</button>
      </div>
      <p class="kp-hint">Digite o código · <kbd>Esc</kbd> sai</p>
    </div>
    <div id="dialog" class="panel" aria-live="polite">
      <div class="d-face" id="d-face"><canvas id="portrait" width="32" height="32"></canvas></div>
      <div class="d-body"><span id="dialog-who"></span><p id="dialog-text"></p><div id="dialog-choices" hidden></div></div>
      <span id="dialog-next">▼</span>
    </div>
    <div id="ending" hidden><div id="ending-lines"></div><p id="ending-cycle"></p></div>
    <div id="title" role="dialog" aria-labelledby="t-name">
      <p class="t-eyebrow">Platão · A República, Livro VII</p>
      <h1 id="t-name">A Ilusão</h1>
      <p class="t-sub">O Interior da Caverna</p>
      <button id="start" type="button">Iniciar</button>
      <p class="t-cycle" id="t-cycle" hidden></p>
      <p class="t-keys"><kbd>←</kbd><kbd>→</kbd> andar · <kbd>Espaço</kbd> pular · <kbd>↓</kbd> agachar · <kbd>E</kbd> interagir</p>
    </div>
  </div>
  <div id="touch" aria-hidden="true">
    <div class="pad"><button type="button" data-k="left">◀</button><button type="button" data-k="down">▼</button><button type="button" data-k="right">▶</button></div>
    <div class="pad"><button type="button" data-k="act">E</button><button type="button" data-k="jump">▲</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
/* =====================================================================
   A ILUSÃO · O Interior da Caverna  (versão 3 · reformulação em pixel art)
   Toda a arte é gerada em código num buffer de 384×216 px, ampliado sem
   suavização. Regra de escala: todos os sprites do Code são desenhados 1:1
   (1 pixel de arte = 1 pixel do buffer) e ancorados nos pés, em canvases
   do mesmo tamanho. Sentado, de pé, caído ou pulando: a escala nunca muda.
   Cenário: nada de esferas. A rocha nasce de máscaras de terreno com perfis
   angulosos e é pintada em facetas (terrain); as camadas são pré-renderizadas
   uma vez, e por quadro só há blits, partículas e o mapa de luz pontilhado.
   ===================================================================== */

// ---------------------------------------------------------------- base
const W = 384, H = 216, TAU = Math.PI * 2;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function rng(seed) { // mulberry32: arte estática determinística
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
const roman = n => { const m = [[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']]; let s = ''; for (const [v, r] of m) while (n >= v) { s += r; n -= v; } return s; };

// ------------------------------------------------- primitivas de pixel
function rect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
// elipse preenchida por linhas inteiras: borda nítida, sem antialias
function ell(g, cx, cy, rx, ry, c) {
  g.fillStyle = c; const R = Math.max(0.5, ry), n = Math.floor(R);
  for (let dy = -n; dy <= n; dy++) {
    const hw = rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (R * R)));
    const x0 = Math.round(cx - hw), x1 = Math.round(cx + hw);
    if (x1 > x0) g.fillRect(x0, Math.round(cy) + dy, x1 - x0, 1);
  }

function polyFill(g, pts, col) {
  let ya = 1e9, yb = -1e9; for (const p of pts) { ya = Math.min(ya, p[1]); yb = Math.max(yb, p[1]); }

    const xs = [];
    for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; if ((a[1] <= y && b[1] > y) || (b[1] <= y && a[1] > y)) xs.push(a[0] + (y - a[1]) / (b[1] - a[1]) * (b[0] - a[0])); }

  }
}

function blocks(g, x0, y0, w, h, R, P) {

      if (PK.lamp.state === 'hand') PK.lamp = { state: 'post' };   // caiu nas estacas com ela: a fase recomeça e a lanterna volta ao poste
      PK.lampK = 0; setInspect(INSPECT_PK); setAmbience('cave', 2);
      setGoal('Suba no escuro até a passagem, no alto à direita');
      (async () => {
        fadeTo(0, .7); await autoWalk(top ? PK.exitX - 34 : 30, 46);
        if (id !== run) return;
        if (!top && !PK.intro) { P.bubble = '?'; await wait(.7); P.bubble = null; }   // primeira vez no escuro: hesita
        if (id !== run) return;
        if (!PK.intro) { PK.intro = true; card('Cenário III', 'A Ascensão'); toast('Você só enxerga o que está perto. Espaço pula (segure para ir mais alto). Estacas reiniciam a fase.', 5.5); }

    },
    update: pkUpdate,
    draw: drawParkour,
  },
  light: {
    enter(id, from) {
      Object.assign(L4, { trig: false, whiteUp: false, stagger: false, glare: 0, nature: false, auto: false, EYES: .7, adapted: !!G.wentOut, leaving: false, amb: '' });
      setInspect(INSPECT_L4);
      if (from === 'outside') {   // voltando do mundo exterior: entra pela boca, vindo da claridade
        resetPlayer(MOUTH.W + 14, CH.floor); P.face = -1; G.camX = MOUTH.W - W; G.camY = 0; G.control = false; G.white = 0; fade.a = 1; fade.color = '#fff4dc'; parts.length = 0; G.step = 'stepStone';
        setGoal('Explore a caverna de novo · a saída para fora fica à direita →');
        (async () => {
          fadeTo(0, .9).then(() => { fade.color = '#000'; }); await autoWalk(MOUTH.trig - 30, 46);
          if (id !== run) return;
          G.control = true;
        })();
        return;
      }
      resetPlayer(-12, CH.floor); G.camX = 0; G.camY = 0; G.control = false; G.white = 0; fade.a = 1; parts.length = 0; G.step = 'stepStone';
      setAmbience('cave', 2);
      setGoal(L4.adapted ? 'Volte para o mundo exterior →' : 'Caminhe em direção à luz →');
      (async () => {
        // sai da subida andando e para, espantado com a claridade lá na frente
        fadeTo(0, 1); await autoWalk(34, 42);
        if (id !== run) return;
        card('Cenário IV', 'A Entrada da Caverna');
        P.pose = 'awe'; P.bubble = '!'; await wait(.9); P.pose = null; P.bubble = null;
        if (id !== run) return;
        G.control = true;
      })();
    },
    update: lightUpdate,
    draw: drawLight,
  },
  outside: {
    enter(id, from) {
      const back = from === 'cave';   // voltando de dentro da caverna: sai pela boca andando, sem desmaio
      resetPlayer(back ? 66 : 118, OUT.ground); P.pose = back ? null : 'lie'; G.camX = 0; G.camY = 0; G.control = false; G.white = back ? 0 : 1; fade.a = 1; parts.length = 0; G.step = 'stepGrass';
      G.wentOut = true;
      Object.assign(O5, { wake: !back, fall: false, crumb: false, inS: false, climb: null, rustle: 0, splT: 0, leafT: 0, leaves: [], fishT: 2, fish: null,
        stag: { x: 640, t: 2, look: false, alert: false },
        rabbits: [{ x: 370, a: 334, b: 412, dir: 1, air: 0, t: 1 }, { x: 800, a: 760, b: 900, dir: -1, air: 0, t: 2 }, { k: 'squirrel', x: 1196, a: 1150, b: 1262, dir: 1, air: 0, t: 1.5 }],
        perch: { x: 287, y: 36, fly: false } });
      setInspect(INSPECT_OUT); setAmbience('nature', 3); G.onInspected = outGoal;
      for (const it of INSPECT_OUT) it.seen = G.outSeen.has(it.id);
      G.seenCount = INSPECT_OUT.filter(it => it.seen && !it.hidden).length;
      if (back) {
        outGoal();
        (async () => {
          fadeTo(0, .8).then(() => { fade.color = '#000'; }); await autoWalk(126, 46);
          if (id !== run) return;
          G.control = true;

        return;

      setGoal('Recupere os sentidos...');
      (async () => {
        await fadeTo(0, 1.6);
        if (id !== run) return;
        card('Cenário V', 'O Mundo Exterior');
        await wait(2.2); P.pose = 'lieOpen'; await wait(.9); P.pose = 'kneel'; await wait(.7); P.pose = null; dustPuff(P.x, OUT.ground, 6); O5.wake = false;
        await wait(.4); await autoWalk(P.x + 22, 30);   // primeiros passos na grama, ainda devagar
        if (id !== run) return;
        await say('...Onde estou?', 'code', 'dazzled');
        await say('Cores. Água que cai. Criaturas vivas. Tudo é tão nítido!', 'code', 'happy');
        await say('O caminho aqui fora não é plano: pule os degraus e o riacho, e segure E junto aos cipós para escalar os paredões.', 'sistema');
        if (id !== run) return;
        G.control = true; outGoal(); setPrompt('Caminhe e contemple o mundo <kbd>→</kbd>', 0, 0, true, 'walk');

    },
    update: outUpdate,
    draw: drawOutside,
  },
  ending: {
    enter(id) { G.control = false; fade.a = 1; fade.color = '#000'; parts.length = 0; setAmbience('none', 3); endingScript(id); },
    update() {},
    draw() { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); },
  },
};
// from: de onde Code chega ('top' = volta do Cenário IV para o alto da subida; 'exit' = volta da subida para o salão)
function go(name, from) {
  run++; waits.length = 0; G.backT = 0; P.auto = null;
  if (D.active) { D.active = false; D.res = null; D.choices = null; UI.dialog.classList.remove('open'); }
  hidePrompt(); meter(false); Q.active = false; UI.qte.hidden = true; setInspect([]); G.onInspected = null;
  UI.toast.hidden = true; UI.toast.classList.remove('show');   // aviso da fase anterior não atravessa para a próxima
  if (name !== 'ending') UI.ending.hidden = true;
  G.scene = name; Scenes[name].enter(run, from); hud();
}
function startGame() {
  if (G.scene !== 'title') return;
  audioInit(); sfx('click'); setAmbience('cave', 3);
  UI.title.hidden = true; stage.focus({ preventScroll: true });
  G.scene = 'starting';
  fadeTo(1, .5).then(() => go('chains'));
}
UI.start.addEventListener('click', startGame);
UI.title.addEventListener('pointerdown', () => { audioInit(); setAmbience('cave', 3); });

// ================================================================ LAÇO
function update(dt) {
  G.time += dt;
  const talking = updateDialog(dt);
  Scenes[G.scene].update(talking ? 0 : dt);
  if (!talking) autoUpdate(dt);
  if (!talking) updateInspect();
  updateParts(dt); tickWaits(); updateFade(dt); audioTick(G.time);
  G.shake = Math.max(0, G.shake - dt * 10); G.flash = Math.max(0, G.flash - dt * 2.2);
  placePrompt();
}
function draw() {
  ctx.save();
  if (G.shake > 0 && !REDUCED) ctx.translate(Math.round((Math.random() * 2 - 1) * G.shake), Math.round((Math.random() * 2 - 1) * G.shake));
  Scenes[G.scene].draw();
  ctx.restore();
  if (G.flash > 0) { ctx.fillStyle = `rgba(${G.flashCol},${G.flash})`; ctx.fillRect(0, 0, W, H); }
  if (fade.a > 0) { ctx.globalAlpha = fade.a; ctx.fillStyle = fade.color; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  update(dt); draw(); pressed.clear();
  requestAnimationFrame(frame);
}

// ================================================================ INÍCIO
const BOOT0 = performance.now();
buildSprites();
LAYER.chamber = buildChamber();
LAYER.chamberFg = buildChamberFg();
LAYER.pkbg = buildParkourBg();
LAYER.parkour = buildParkour();
for (const m of MOVERS_DEF) LAYER['mover' + m.x] = buildMover(m);
LAYER.mouth = buildMouth();
LAYER.mouthFg = buildMouthFg();
LAYER.secret = buildSecret();
LAYER.vig = buildVignette();
buildOutside();
O5.fallFrames = waterFrames(VALLEY.fall.w, VALLEY.fall.h, 6, 3);
O5.cascade = waterFrames(OUT.streamW - 4, 44, 6, 9);
OUT.tufts = []; { const R = rng(61); for (let x = 130; x < OUT.edge - 70; x += 18 + R() * 40) { const gx = Math.round(x), gy = outTop(gx); if (gy <= 170 && gy === outTop(gx - 3) && gy === outTop(gx + 10)) OUT.tufts.push([gx, gy]); } }
if (G.cycle > 1) { UI.tCycle.hidden = false; UI.tCycle.textContent = 'Você já passou por ' + (G.cycle - 1) + (G.cycle - 1 === 1 ? ' ciclo.' : ' ciclos.'); }
Scenes.title.enter(); hud();
// ganchos de depuração: tick(n, dt) avança n quadros à mão (útil quando a aba está em segundo plano)
window.__ilusao = { G, P, go, keys, pressed, ST, PK, Q, runQTE, O5, C1, D, L4, S, LAYER, KP, SEC, SECR, SECRET, kpPress, fade, portrait, PK_SOLIDS, OUT, CLIMBS, outTop, bootMs: Math.round(performance.now() - BOOT0), INSPECT: () => INSPECT, tick(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) { update(dt); pressed.clear(); } draw(); } };
requestAnimationFrame(frame);
})();
